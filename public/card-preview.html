<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>四款游戏 · 卡牌图鉴</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/quanc.css" />
  <link rel="stylesheet" href="css/red7.css" />
  <link rel="stylesheet" href="css/regicide.css" />
  <link rel="stylesheet" href="css/presages.css" />
  <link rel="stylesheet" href="css/card-designs.css?v=2" />
  <style>
    .preview { max-width: 1240px; margin: 0 auto; padding: 20px; padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
    .preview h1 { font-size: 24px; margin-bottom: 4px; }
    .preview .sub { opacity: 0.7; margin-bottom: 24px; font-size: 13px; }

    .family-section { margin-bottom: 30px; }
    .family-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 18px; font-weight: 700; margin-bottom: 14px;
    }
    .family-title .ico { font-size: 22px; }
    .family-color { width: 10px; height: 10px; border-radius: 50%; }

    .type-grid { display: flex; flex-wrap: wrap; gap: 22px; }
    .type-cell { display: flex; flex-direction: column; gap: 8px; align-items: center; }
    .type-name { font-size: 13px; font-weight: 600; opacity: 0.85; }
    .card-pair { display: flex; flex-direction: column; gap: 12px; align-items: center; }
    body { background: #141c20; color: #edf1f2; }
    .preview { max-width: 1100px; }
    .preview h1 { font-size: 28px; }
    .preview-nav { display: flex; flex-wrap: wrap; gap: 18px; padding: 16px 0; margin-bottom: 20px; border-bottom: 1px solid #ffffff26; }
    a { color: #c4ddcf; text-underline-offset: 5px; }
    .collection { padding: 22px 0; border-bottom: 1px solid #ffffff26; scroll-margin-top: 16px; }
    .collection h2 { font-size: 20px; margin-bottom: 20px; }
    .collection h2 small { display: inline-block; font-size: 12px; font-weight: 400; color: #a3b3b9; margin-left: 12px; }
    .sample-row { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start; padding: 10px 4px 18px; }
    .family-section { padding-top: 12px; }
    .type-grid { gap: 18px; padding: 8px 4px; }
    .type-name { color: #c0ccd1; }
    @media (max-width: 480px) {
      .preview { padding: 16px 12px; }
      .preview h1 { font-size: 24px; }
      .collection h2 small { display: block; margin: 5px 0 0; }
      .sample-row, .type-grid { gap: 14px; }
    }
  </style>
</head>
<body>
  <div class="preview">
    <a href="/">← 游戏库</a>
    <h1 style="margin-top:20px">卡牌图鉴</h1>
    <nav class="preview-nav" aria-label="游戏"><a href="#quanc">Quanc</a><a href="#red7">Red7</a><a href="#regicide">Regicide</a><a href="#presages">Presages</a></nav>
    <section class="collection" id="red7"><h2>Red7 <small>色谱 · 数字与规则</small></h2><div class="sample-row" id="r7-samples"></div></section>
    <section class="collection" id="regicide"><h2>Regicide <small>宫廷 · 纸质与花色</small></h2><div class="sample-row" id="rg-samples"></div></section>
    <section class="collection" id="presages"><h2>Presages <small>秘境 · 插画与预兆</small></h2><div class="sample-row" id="ps-samples"></div></section>
    <section class="collection" id="quanc"><h2>Quanc <small>纹章 · 六大家族</small></h2><div id="preview"></div></section>
  </div>

  <script>
    // 与 src/icons.js 一致的 SVG 模板与图标
    const svg = (body) =>
      `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;

    const FAMILIES = [
      { id: 'lion', name: '狮族', color: '#d4a017' },
      { id: 'eagle', name: '鹰族', color: '#5b8dd9' },
      { id: 'wolf', name: '狼族', color: '#9aa4b2' },
      { id: 'serpent', name: '蛇族', color: '#c2185b' },
      { id: 'stag', name: '鹿族', color: '#4caf50' },
      { id: 'bear', name: '熊族', color: '#8d5524' },
    ];

    const TYPES = [
      { id: 'assassin', name: '刺客' },
      { id: 'spy', name: '间谍' },
      { id: 'noble', name: '贵族' },
      { id: 'guard', name: '守卫' },
      { id: 'plain', name: '平民' },
    ];

    const FAMILY_ICONS = {
      lion: svg('<circle cx="12" cy="12.5" r="3.8"/><path d="M12 4.6v2M6.6 7l1.4 1.4M4.6 12.5H7M6.6 18l1.4-1.4M12 20.4v-2M17.4 18l-1.4-1.4M19.4 12.5H17M17.4 7 16 8.4"/>'),
      eagle: svg('<path d="M12 6L11 10C7 9.5 3.5 9.5 2 10.5C1.8 12 3 13.8 5 14.2C8 14.8 10 14.8 11.5 14.5L12 18L12.5 14.5C14 14.8 16 14.8 19 14.2C21 13.8 22.2 12 22 10.5C20.5 9.5 17 9.5 13 10L12 6z"/>'),
      wolf: svg('<path d="M12 3.5 6 8l5 1.5z"/><path d="M12 3.5 18 8l-5 1.5z"/><path d="M6.5 8h11L16 16.5 12 21.5 8 16.5z"/><circle cx="10" cy="12" r=".6" fill="currentColor" stroke="none"/><circle cx="14" cy="12" r=".6" fill="currentColor" stroke="none"/>'),
      serpent: svg('<path d="M17 7.5c2.5 1 2.5 4 .5 5.5S8 11 7 14s1 5 4 5.5c1.5.3 3-.3 4-1.5"/><circle cx="18" cy="7.5" r="1.7"/>'),
      stag: svg('<path d="M9.5 10.5 6.5 4.5 3.5 6M6.5 4.5 8 8.5"/><path d="M14.5 10.5 17.5 4.5 20.5 6M17.5 4.5 16 8.5"/><path d="M9.5 10.5h5l-1 9h-3z"/><circle cx="10.5" cy="13" r=".6" fill="currentColor" stroke="none"/><circle cx="13.5" cy="13" r=".6" fill="currentColor" stroke="none"/>'),
      bear: svg('<circle cx="8.5" cy="8.5" r="2.6"/><circle cx="15.5" cy="8.5" r="2.6"/><circle cx="12" cy="14.5" r="5.5"/>'),
    };

    const TYPE_ICONS = {
      assassin: svg('<path d="M12 3l4 7-4 5-4-5z"/><path d="M8 15h8"/><path d="M12 15v5"/><path d="M10 20h4"/>'),
      spy: svg('<path d="M2 12s3.5-5.5 10-5.5S22 12 22 12s-3.5 5.5-10 5.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.8"/>'),
      noble: svg('<path d="M5 8l4 4 3-5 3 5 4-4-1 10H6z"/>'),
      guard: svg('<path d="M12 3l8 3v6c0 4.5-3.2 6.5-8 9-4.8-2.5-8-4.5-8-9V6z"/><path d="M12 9l3 3-3 3-3-3z"/>'),
    };

    const BACK_EMBLEM = svg('<path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>');

    // 卡牌背面（间谍背面 / 牌堆）：仅牌背 + 问号水印
    function backCardNode(mini) {
      const cls = mini ? 'card card-mini card-back' : 'card card-back';
      return `<div class="${cls}">
        <div class="card-frame">
          <div class="card-tex"></div>
          <div class="card-emblem"><span class="ico">${BACK_EMBLEM}</span></div>
        </div>
      </div>`;
    }

    // 生成卡牌 DOM（大卡含类型 SVG，小卡仅类型文字）
    function cardNode(family, type, mini) {
      const cls = ['card'];
      if (mini) cls.push('card-mini');
      cls.push(`card-${type.id}`);
      const typeSvg = TYPE_ICONS[type.id] || '';
      const typeInner = mini
        ? `<span>${type.name}</span>`
        : `${typeSvg ? `<span class="ico">${typeSvg}</span>` : ''}<span>${type.name}</span>`;
      const weight = type.id === 'noble' ? '<div class="card-weight">×2</div>' : '';
      return `<div class="${cls.join(' ')}" style="--c:${family.color}">
        <div class="card-frame">
          <div class="card-tex"></div>
          <div class="card-gloss"></div>
          <div class="card-emblem"><span class="ico">${FAMILY_ICONS[family.id]}</span></div>
          <div class="card-fam">${family.name}</div>
          <div class="card-type">${typeInner}</div>
        </div>
        ${weight}
      </div>`;
    }

    const container = document.getElementById('preview');
    container.innerHTML = FAMILIES.map((family) => {
      const cells = TYPES.map((type) => `
        <div class="type-cell">
          <span class="type-name">${type.name}</span>
          <div class="card-pair">
            ${cardNode(family, type, false)}
            ${cardNode(family, type, true)}
          </div>
        </div>
      `).join('');
      return `
        <section class="family-section">
          <div class="family-title">
            <span class="ico">${FAMILY_ICONS[family.id]}</span>
            <span>${family.name}</span>
            <span class="family-color" style="background:${family.color}"></span>
          </div>
          <div class="type-grid">${cells}</div>
        </section>
      `;
    }).join('') + `
      <section class="family-section">
        <div class="family-title">
          <span class="ico">${BACK_EMBLEM}</span>
          <span>卡牌背面</span>
        </div>
        <div class="type-grid">
          <div class="type-cell">
            <span class="type-name">大卡</span>
            <div class="card-pair">${backCardNode(false)}</div>
          </div>
          <div class="type-cell">
            <span class="type-name">小卡</span>
            <div class="card-pair">${backCardNode(true)}</div>
          </div>
        </div>
      </section>
    `;
  </script>
  <script>
    const pair = (large, mini) => `<div class="card-pair">${large}${mini}</div>`;
    const colors = ['#d93942','#ef8c30','#e3bd22','#409d68','#389fba','#455eb0','#9953ad'];
    const names = ['红','橙','黄','绿','蓝','靛','紫'];
    document.querySelector('#r7-samples').innerHTML = colors.map((c,i) => {
      const node = mini => `<div class="r7-card ${mini ? 'r7-card-mini' : ''}" style="--c:${c}"><div class="r7-num">${7-i}</div><div class="r7-color">${names[i]}</div></div>`;
      return pair(node(false),node(true));
    }).join('');
    document.querySelector('#rg-samples').innerHTML = ['♥','♦','♣','♠','JOKER'].map((s,i) => {
      const node = mini => `<div class="rg-card ${mini ? 'rg-card-mini' : ''} ${i===4 ? 'rg-card-joker' : ''}" style="--c:${i<2 ? '#c32f48' : '#283a42'}"><div class="rg-num">${['A','10','J','K','★'][i]}</div><div class="rg-suit">${s}</div></div>`;
      return pair(node(false),node(true));
    }).join('');
    const omens = [[1,'生命','#3f9b4f','弃掉数值最高的绿色牌。'],[10,'谜','#d9ae2e','场上若有至少一张绝对牌（30-35），弃掉此牌。'],[17,'狡黠','#8a5cc9','此牌属于所有颜色（绿、黄、红、蓝）。'],[26,'悲伤','#3f78c9','忽略数值最高的牌。']];
    document.querySelector('#ps-samples').innerHTML = omens.map(([n,name,c,effect]) => {
      const node = mini => `<div class="ps-card ps-card-art ps-card-n${n} ${mini ? 'ps-card-mini' : ''}" style="--c:${c}">${mini ? `<div class="ps-corner">${n}</div><div class="ps-name">${name}</div>` : `<div class="ps-head"><div class="ps-corner">${n}</div><div class="ps-name">${name}</div><div class="ps-sym"><img src="assets/沙漏.svg" width="14" height="14" alt="回合结束" /></div></div><div class="ps-effect">${effect}</div>`}</div>`;
      return pair(node(false),node(true));
    }).join('');
    for (const card of document.querySelectorAll('.card, .r7-card, .rg-card, .ps-card')) {
      const selectedClass = card.classList.contains('r7-card') ? 'r7-card-selected' : card.classList.contains('rg-card') ? 'rg-card-selected' : card.classList.contains('ps-card') ? 'ps-card-selected' : 'card-selected';
      card.setAttribute('role','button'); card.tabIndex = 0;
      card.setAttribute('aria-label', card.textContent.trim() || '牌背');
      card.setAttribute('aria-pressed','false');
      const toggle = () => card.setAttribute('aria-pressed', String(card.classList.toggle(selectedClass)));
      card.addEventListener('click',toggle);
      card.addEventListener('keydown',e => { if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
    }
  </script>
</body>
</html>
