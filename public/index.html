<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>游戏合集</title>
  <link rel="stylesheet" href="css/base.css?v=14" />
  <link id="card-designs" rel="stylesheet" href="css/card-designs.css?v=2" />
  <link rel="stylesheet" href="css/library.css?v=1" />
  <link rel="stylesheet" href="css/table-theme.css?v=4" />
</head>
<body>
  <!-- 游戏库：选择游戏 -->
  <section id="library" class="screen">
    <aside class="library-sidebar">
      <a class="library-brand" href="/" aria-label="游戏盒子首页"><span class="library-brand-mark">✳</span><span>一起玩<small>PLAYBOX</small></span></a>
      <p class="library-side-caption">LET’S HANG OUT</p>
      <nav aria-label="首页导航"><a class="library-nav-active" href="#game-grid"><span aria-hidden="true">▦</span>游戏大厅<span class="library-nav-count">04</span></a></nav>
      <div class="library-side-bottom"><p>好朋友，<br />就要一起玩。</p><span>PLAY MORE. TOGETHER.</span></div>
    </aside>
    <div class="library-workspace">
    <div class="library-topbar"><a href="/" class="library-top-brand">一起玩 <small>PLAYBOX</small></a><span class="library-breadcrumb">游戏盒子 <span>/</span> 发现好游戏</span><label class="library-nickname">你的昵称
      <input id="player-name" type="text" placeholder="1至4个中文或英文字母" maxlength="4" autocomplete="nickname" />
    </label></div>
    <div class="library-content">
    <header class="library-hero">
      <div class="library-heading">
        <p class="library-eyebrow">A LITTLE PLAY, A LOT OF JOY</p>
        <h1>好朋友，开一局。</h1>
        <p class="subtitle">把朋友聚在一起，把无聊留在外面。</p>
      </div>
      <button id="open-join-btn" class="btn btn-primary">加入房间</button>
    </header>
    <div class="library-section-heading"><h2>挑一款，快乐就位 <span>04</span></h2><p>每一局，都是聚在一起的好理由。</p></div>
    <div id="game-grid" class="game-grid"></div>
    <div id="library-status" class="status" role="status"></div>
    <footer class="library-footer"><span>PLAY MORE. TOGETHER.</span><span>让快乐，发生在一起。</span></footer>
    </div>
    </div>
  </section>

  <!-- 首页加入房间 -->
  <dialog id="join-dialog" aria-labelledby="join-title">
    <form id="join-form">
      <div class="join-dialog-head"><h2 id="join-title">加入房间</h2><button id="close-join-btn" class="btn btn-ghost" type="button" aria-label="关闭">×</button></div>
      <label>对局 ID
        <input id="join-match" type="text" placeholder="例如：1234" maxlength="4" inputmode="numeric" pattern="[0-9]{4}" required />
      </label>
      <div id="join-status" class="status" role="status"></div>
      <button id="join-btn" class="btn btn-primary" type="submit">加入房间</button>
    </form>
  </dialog>

  <!-- 房间等待界面：人数到齐后房主才能开始 -->
  <section id="lobby" class="screen" style="display:none;">
    <h1>游戏房间</h1>
    <p id="lobby-subtitle" class="subtitle">玩家就位后，由房主开始游戏</p>

    <div class="room-card">
      <div class="room-head">
        <div class="match-info">
          <span>对局 ID</span>
          <span id="room-match-id" class="match-id">-</span>
          <button id="room-copy-btn" class="btn btn-sm">复制邀请</button>
        </div>
        <div id="room-count" class="room-count"></div>
      </div>

      <div id="room-seats" class="seats"></div>

      <div id="room-action" class="room-action"></div>
      <div id="room-status" class="status"></div>

      <button id="room-leave-btn" class="btn btn-leave">离开房间</button>
    </div>
  </section>

  <!-- 游戏界面 -->
  <section id="game" class="screen" style="display:none;">
    <header class="game-header">
      <h1 id="game-title">游戏</h1>
      <div class="game-header-right">
        <div class="match-info">
          <span>对局 ID</span>
          <span id="match-id" class="match-id">-</span>
          <button id="copy-match-btn" class="btn btn-sm">复制</button>
        </div>
        <button id="end-game-btn" class="btn btn-sm">结束游戏</button>
      </div>
    </header>

    <div id="gameover" class="gameover-box" style="display:none;"></div>

    <!-- 游戏专属界面由 JS 按当前游戏从下方 <template> 注入 -->
    <div id="game-body"></div>
  </section>

  <!-- Quanc 游戏界面模板 -->
  <template id="template-quanc">
    <div class="game-layout">
      <!-- 上方：餐桌（得宠区 / 失宠区） -->
      <main class="table-wrap">
        <div id="table" class="table"></div>
      </main>

      <!-- 下方：各玩家领地 -->
      <aside id="players" class="players"></aside>

      <!-- 日志区域（已通过 CSS 隐藏，保留节点） -->
      <aside id="log" class="log"></aside>
    </div>

    <!-- 底部：本回合手牌与出牌操作 -->
    <footer class="hand-wrap">
      <div id="task-panel" class="task-panel"></div>
      <div class="section-label section-label-hand">手牌区</div>
      <div id="hand" class="hand"></div>
      <div id="play-panel" class="play-panel"></div>
    </footer>
  </template>

  <!-- Red7 游戏界面模板 -->
  <template id="template-red7">
    <div class="game-layout">
      <!-- 上方：规则区 / 画布区 -->
      <main class="table-wrap">
        <div id="table" class="table"></div>
      </main>

      <!-- 下方：各玩家调色盘 -->
      <aside id="players" class="players"></aside>

      <!-- 日志区域（已通过 CSS 隐藏，保留节点） -->
      <aside id="log" class="log"></aside>
    </div>

    <!-- 底部：手牌与行动 -->
    <footer class="hand-wrap">
      <div class="section-label section-label-hand">手牌区</div>
      <div id="hand" class="hand"></div>
      <div id="play-panel" class="play-panel"></div>
    </footer>
  </template>

  <!-- Regicide 游戏界面模板 -->
  <template id="template-regicide">
    <div class="game-layout">
      <!-- 上方：战场（敌人 / 牌堆 / 战利品） -->
      <main class="table-wrap">
        <div id="table" class="table"></div>
      </main>

      <!-- 下方：各玩家区 -->
      <aside id="players" class="players"></aside>

      <!-- 日志区域（已通过 CSS 隐藏，保留节点） -->
      <aside id="log" class="log"></aside>
    </div>

    <!-- 底部：手牌与行动 -->
    <footer class="hand-wrap">
      <div class="section-label section-label-hand">手牌区</div>
      <div id="hand" class="hand"></div>
      <div id="play-panel" class="play-panel"></div>
    </footer>
  </template>

  <!-- Presages 游戏界面模板 -->
  <template id="template-presages">
    <div class="game-layout">
      <!-- 上方：轮次 / 队伍 / 场上 -->
      <main class="table-wrap">
        <div id="table" class="table"></div>
      </main>

      <!-- 下方：各玩家区域 -->
      <aside id="players" class="players"></aside>

      <!-- 日志区域（已通过 CSS 隐藏，保留节点） -->
      <aside id="log" class="log"></aside>
    </div>

    <!-- 底部：手牌与行动 -->
    <footer class="hand-wrap">
      <div class="section-label section-label-hand">手牌区</div>
      <div id="hand" class="hand"></div>
      <div id="play-panel" class="play-panel"></div>
    </footer>
  </template>

  <script src="client.js?v=102"></script>
</body>
</html>
